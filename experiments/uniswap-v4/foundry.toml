[profile.default]
src = "src"
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
remappings = [
  "v4-core/=lib/v4-core/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
  "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/"
]

[profile.default.fuzz]
runs = 256
seed = "0x1234"
