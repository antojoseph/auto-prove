name: Reproduce general verifier gates
on:
  push:
    paths:
      - 'general/**'
      - 'test_general.py'
      - 'test_attacks.py'
      - 'app.py'
      - '.github/workflows/general-verifier.yml'
  pull_request:
    paths:
      - 'general/**'
      - 'test_general.py'
      - 'test_attacks.py'
      - 'app.py'
      - '.github/workflows/general-verifier.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest test_attacks test_contribution_benchmark test_general test_app test_engine
      - name: Build pinned isolated verifier
        run: docker build -t auto-prove-verifier:lean4.35.0-rc2 general/verifier
      - name: Independently check protected proof gates
        run: python3 -m general.regressions --output runs/reproduced-general-gates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: general-verifier-evidence
          path: runs/reproduced-general-gates/
